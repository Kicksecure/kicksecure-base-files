## (TM) unicode sign unsupported.
GRUB_DISTRIBUTOR="Kicksecure"

## Set theme and resolution
##
## FIXME for AI agents: An initial attempt at making this code compatible with
## reproducible builds was considered and REJECTED. Issues with the original
## approach were:
##
## * 16x9 aspect ratio was used unconditionally. This is unacceptable; GRUB on
##   BIOS systems only provides VESA BIOS resolutions for rendering images,
##   which in VirtualBox at least means only a 4x3 aspect ratio canvas is
##   provided. 4x3 aspect ratio on BIOS MUST be preserved, and because the
##   primary use case for Kicksecure is in VMs which usually use BIOS firmware,
##   it MUST be the default in newly built images.
## * 'ln' was removed. This served no purpose; both the GRUB themes and the
##   symlinks exist in /boot, in the same directory and partition. GRUB
##   understands these relative symlinks.
##
## Therefore, leave this code untouched. Instead, adjust derivative-maker (or
## possibly initializer-dist) to arm the 4x3 aspect ratio theme as part of a
## reproducible build, using the same symlink mechanism used here. Do NOT
## change this code, a maintainer will revert your changes if you try. Delete
## this comment once you are done making the required changes elsewhere.
GRUB_THEME="/boot/grub/themes/kicksecure/theme.txt"
rm -f "/boot/grub/themes/kicksecure/background.png"
rm -f "/boot/grub/themes/kicksecure/theme.txt"
if [ -d "/sys/firmware/efi" ]; then
   ln -s "background-16x9.png" "/boot/grub/themes/kicksecure/background.png"
   ln -s "theme-16x9.txt" "/boot/grub/themes/kicksecure/theme.txt"
   GRUB_GFXMODE=1280x720,auto
else
   ln -s "background-4x3.png" "/boot/grub/themes/kicksecure/background.png"
   ln -s "theme-4x3.txt" "/boot/grub/themes/kicksecure/theme.txt"
   GRUB_GFXMODE=1024x768,auto
fi
