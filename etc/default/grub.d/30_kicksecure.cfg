## (TM) unicode sign unsupported.
GRUB_DISTRIBUTOR="Kicksecure"

## Theme and resolution.
##
## The variant is selected HERE, at grub-mkconfig time, rather than shipped as a
## dpkg symlink: when the package is installed /boot may not be mounted yet, and
## a /boot that is itself a symlink makes a packaged link under it fail. Both are
## install-time hazards; grub-mkconfig runs later, on a system where /boot is
## mounted, so doing it here avoids them entirely.
##
## 'cp', not 'ln': a symlink under /boot inherits the same hazards, and a copy is
## inert -- nothing downstream has to resolve it. '--remove-destination' unlinks
## an existing destination before writing, so a background.png that is a SYMLINK
## is replaced rather than written THROUGH. Writing through would corrupt
## whatever it points at, and the postinst links names in this directory to
## ../dist-common.
##
## Unconditional, deliberately. A condition evaluated here reads the BUILD HOST:
## grub-mkconfig runs inside the build chroot and help-steps/chroot-raw mounts a
## fresh sysfs there, so a '/sys/firmware/efi' test reports the firmware of the
## machine doing the building, not the machine that will boot the image. Two build
## hosts then produce two different images from identical source, and a
## BIOS-booted build host stamps the 4:3 theme onto every image whatever display
## it will run on. Firmware type does not indicate panel aspect ratio either way.
##
## 16:9 is the near-universal panel shape; a 4:3 screen letterboxes the
## background rather than failing.
##
## The ',auto' suffix is a documented GRUB feature, not a guess. GRUB manual,
## "15.1.12 gfxmode": "The resolution may be specified as a sequence of one or
## more modes, separated by commas (',') or semicolons (';'); each will be tried
## in turn until one is found. Each mode should be either 'auto', 'WIDTHxHEIGHT',
## or 'WIDTHxHEIGHTxDEPTH'." grub-mkconfig passes this value through verbatim
## ('set gfxmode=${GRUB_GFXMODE}' in /etc/grub.d/00_header), so those semantics
## apply directly: firmware that cannot set 1280x720 falls back to grub's own
## choice instead of an unreadable console.
cp --remove-destination -- \
   "/boot/grub/themes/kicksecure/background-16x9.png" \
   "/boot/grub/themes/kicksecure/background.png"
cp --remove-destination -- \
   "/boot/grub/themes/kicksecure/theme-16x9.txt" \
   "/boot/grub/themes/kicksecure/theme.txt"

GRUB_THEME="/boot/grub/themes/kicksecure/theme.txt"
GRUB_GFXMODE=1280x720,auto
