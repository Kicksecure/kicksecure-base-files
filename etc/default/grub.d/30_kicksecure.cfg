## (TM) unicode sign unsupported.
GRUB_DISTRIBUTOR="Kicksecure"

## Theme and resolution.
##
## The theme variant is a SHIPPED symlink (debian/kicksecure-base-files.links),
## not something this file picks at runtime. It used to branch on
## '/sys/firmware/efi' and create the symlinks itself, which was wrong twice
## over: grub-mkconfig runs inside the BUILD chroot -- and help-steps/chroot-raw
## mounts a fresh sysfs there -- so the test read the BUILD HOST's firmware, not
## the target's. Two build hosts therefore produced two different images from the
## same source, and a BIOS-booted build host stamped the 4:3 theme onto every
## image regardless of the display it would ever run on. Firmware type says
## nothing about panel aspect ratio in any case.
##
## 16:9 is the near-universal panel shape; a 4:3 screen letterboxes the
## background rather than failing. 'auto' is the fallback for firmware that
## cannot set 1280x720, so an unavailable mode degrades to grub's own choice
## instead of an unreadable console.
GRUB_THEME="/boot/grub/themes/kicksecure/theme.txt"
GRUB_GFXMODE=1280x720,auto
